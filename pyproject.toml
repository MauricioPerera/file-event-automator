[project]
name = "file-event-automator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mauricio Perera", email = "mauricio.perera@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "watchdog>=6.0.0",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "requests-mock>=1.12.1",
]

[project.scripts]
file-automator = "file_event_automator.cli:main"

